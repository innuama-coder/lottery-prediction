[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "autoresearch-lotte"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["jsonschema[format]==4.26.0"]

[project.scripts]
lottery-data = "lottery_data.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.data-files]
"share/autoresearch-lotte/schemas/phase1" = ["schemas/phase1/*.json"]
"share/autoresearch-lotte/schemas/phase2" = ["schemas/phase2/*.json"]
"share/autoresearch-lotte/config/phase1" = ["config/phase1/source-catalog.json", "config/phase1/collection-policy.json", "config/phase1/live-source-policy.json"]
"share/autoresearch-lotte/tests/phase1/fixtures/spec" = ["tests/phase1/fixtures/spec/spec-bundle-freeze.json", "tests/phase1/fixtures/spec/hash-vectors.json"]
"share/autoresearch-lotte/tests/phase1/fixtures/live-execution" = ["tests/phase1/fixtures/live-execution/*.json"]
"share/autoresearch-lotte/docs/data" = ["docs/data/lottery-data-spec-v1.md"]

[tool.setuptools.packages.find]
where = ["src"]
